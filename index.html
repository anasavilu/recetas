<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recetario</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap');

:root{
  --paper:#EEF0E2;
  --paper-card:#F7F8EF;
  --ink:#23261F;
  --ink-soft:#5B5F51;
  --accent:#D8A13A;
  --accent-ink:#3A2A08;
  --herb:#4E6E4E;
  --herb-ink:#F7F8EF;
  --line:#C7C2A9;
  --danger:#B4483A;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper);
  background-image: radial-gradient(var(--line) 0.6px, transparent 0.6px);
  background-size: 18px 18px;
  color:var(--ink); font-family:'Space Grotesk', sans-serif; min-height:100vh;
}
h1,h2,h3{font-family:'Fraunces', serif; margin:0; font-weight:600;}
button{font-family:inherit; cursor:pointer;}
.wrap{max-width:980px; margin:0 auto; padding:28px 20px 80px;}

.loginwrap{max-width:360px; margin:80px auto; text-align:center;}
.loginwrap h1{font-size:2rem; margin-bottom:6px;}
.loginwrap p{color:var(--ink-soft); font-size:0.88rem; margin-bottom:20px;}
.loginwrap input{width:100%; padding:12px; border:1.5px solid var(--ink); border-radius:4px; font-size:1.1rem; text-align:center; letter-spacing:0.2em; margin-bottom:12px; background:var(--paper-card);}
.loginwrap button{width:100%; background:var(--accent); color:var(--accent-ink); border:1.5px solid var(--ink); padding:11px; border-radius:4px; font-weight:600; box-shadow:3px 3px 0 var(--ink);}
.loginerr{color:var(--danger); font-size:0.85rem; min-height:1.2em; margin-top:8px;}

.top{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
.top h1{font-size:2.1rem; letter-spacing:-0.01em;}
.top .sub{color:var(--ink-soft); font-size:0.85rem; margin-top:2px;}
.newbtn{background:var(--accent); color:var(--accent-ink); border:1.5px solid var(--ink); padding:10px 16px; font-size:0.95rem; font-weight:600; border-radius:3px; box-shadow:3px 3px 0 var(--ink);}
.newbtn:active{box-shadow:1px 1px 0 var(--ink); transform:translate(2px,2px);}

.searchrow{display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
.searchrow input[type=text]{flex:1; min-width:200px; padding:9px 12px; border:1.5px solid var(--ink); border-radius:3px; background:var(--paper-card); font-family:inherit; font-size:0.9rem; color:var(--ink);}

.tagbar{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px;}
.chip{padding:5px 12px; border:1.3px solid var(--ink); border-radius:999px; font-size:0.78rem; background:transparent; color:var(--ink);}
.chip.on{background:var(--herb); color:var(--herb-ink); border-color:var(--herb);}
.chip.empty{border-style:dashed; color:var(--ink-soft);}

.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:18px;}
.card{background:var(--paper-card); border:1.5px solid var(--ink); border-radius:4px; padding:14px; box-shadow:4px 4px 0 var(--line); cursor:pointer; display:flex; flex-direction:column; gap:8px; min-height:150px;}
.card:nth-child(3n+1){transform:rotate(-0.4deg);}
.card:nth-child(3n+2){transform:rotate(0.3deg);}
.card:hover{box-shadow:4px 4px 0 var(--ink);}
.card .kind{font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft);}
.card h3{font-size:1.15rem; line-height:1.2;}
.card .tagsmini{display:flex; flex-wrap:wrap; gap:4px; margin-top:auto;}
.card .tagsmini span{font-size:0.7rem; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:2px 8px; color:var(--ink-soft);}

.empty-state{border:1.5px dashed var(--line); border-radius:4px; padding:40px 20px; text-align:center; color:var(--ink-soft);}
.empty-state h3{color:var(--ink); margin-bottom:8px;}

.overlay{position:fixed; inset:0; background:rgba(35,38,31,0.55); display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto; z-index:50;}
.modal{background:var(--paper-card); border:1.5px solid var(--ink); border-radius:6px; max-width:640px; width:100%; padding:24px; box-shadow:6px 6px 0 var(--ink); margin-bottom:40px;}
.modal h2{font-size:1.5rem; margin-bottom:14px;}
.closebtn{float:right; border:none; background:none; font-size:1.3rem; color:var(--ink-soft); line-height:1;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:5px;}
.field input[type=text], .field input[type=url], .field textarea{width:100%; padding:9px 11px; border:1.3px solid var(--line); border-radius:3px; font-family:inherit; font-size:0.9rem; background:var(--paper); color:var(--ink); resize:vertical;}
.field textarea{min-height:90px;}

.sourcechoice{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.sourcechoice button{padding:9px 14px; border:1.5px solid var(--ink); border-radius:3px; background:transparent; font-size:0.85rem;}
.sourcechoice button.active{background:var(--ink); color:var(--paper-card);}

.aibtn{background:var(--herb); color:var(--herb-ink); border:1.3px solid var(--herb); padding:9px 14px; border-radius:3px; font-size:0.85rem; font-weight:500;}
.aibtn:disabled{opacity:0.5; cursor:default;}

.listedit{display:flex; flex-direction:column; gap:6px;}
.listedit .row{display:flex; gap:6px;}
.listedit input{flex:1;}
.listedit button.rm{border:1px solid var(--line); background:none; color:var(--danger); border-radius:3px; width:30px;}
.addline{border:1.3px dashed var(--line); background:none; border-radius:3px; padding:6px; font-size:0.8rem; color:var(--ink-soft); text-align:left;}

.savebar{display:flex; align-items:center; justify-content:flex-end; margin-top:18px; gap:10px; flex-wrap:wrap;}
.savebtn{background:var(--accent); color:var(--accent-ink); border:1.5px solid var(--ink); padding:9px 18px; border-radius:3px; font-weight:600; box-shadow:3px 3px 0 var(--ink);}
.savebtn:disabled{opacity:0.6;}

.detail-media{margin-bottom:16px;}
.detail-media img{width:100%; border:1.3px solid var(--ink); border-radius:4px; display:block;}
.detail-media iframe{width:100%; aspect-ratio:16/9; border:1.3px solid var(--ink); border-radius:4px;}
.detail-tags{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px;}
.detail-cols{display:grid; grid-template-columns:1fr 1.4fr; gap:22px;}
@media(max-width:560px){.detail-cols{grid-template-columns:1fr;}}
.detail-cols h4{font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:8px;}
.detail-cols ul, .detail-cols ol{padding-left:18px; margin:0; display:flex; flex-direction:column; gap:6px; font-size:0.92rem;}
.srclink{font-size:0.8rem; color:var(--ink-soft); margin-top:16px; display:block;}
.detailbar{display:flex; justify-content:flex-end; margin-top:18px;}
.delbtn{border:1.3px solid var(--danger); color:var(--danger); background:none; padding:7px 12px; border-radius:3px; font-size:0.8rem;}

.hint{font-size:0.78rem; color:var(--ink-soft); margin-top:-6px; margin-bottom:12px; line-height:1.4;}
.status{font-size:0.8rem; color:var(--herb); margin-bottom:10px; min-height:1em;}
.err{color:var(--danger);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const app = document.getElementById('app');
let token = localStorage.getItem('recetario_token') || null;

let state = {
  recipes: [],
  activeTags: new Set(),
  query: '',
  modal: null,
  selected: null,
  addStep: 'source',
  addSource: null,
  form: null,
  loading: true,
  aiStatus: '',
  loginErr: '',
};

function uid(){ return 'r'+Date.now().toString(36); }

async function api(path, opts={}){
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'x-app-token': token, ...(opts.headers||{}) }
  });
  if(res.status === 401){
    token = null; localStorage.removeItem('recetario_token');
    render();
    throw new Error('Sesión expirada, vuelve a introducir el PIN');
  }
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Error de servidor');
  return data;
}

async function login(pin){
  state.loginErr = '';
  try{
    const data = await api('/api/login', { method:'POST', body: JSON.stringify({ pin }) });
    token = data.token;
    localStorage.setItem('recetario_token', token);
    await loadAll();
  }catch(e){ state.loginErr = e.message; render(); }
}

async function loadAll(){
  state.loading = true; render();
  try{
    state.recipes = await api('/api/recipes');
  }catch(e){ state.recipes = []; }
  state.loading = false;
  render();
}

function extractYoutubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}
function normTag(t){ return t.toLowerCase().trim().replace(/^(el|la|los|las|un|una)\s+/,''); }
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

// ---------- render ----------
function render(){
  app.innerHTML = '';
  if(!token){ app.appendChild(renderLogin()); return; }
  app.appendChild(renderHeader());
  if(state.loading){
    const p = document.createElement('div'); p.className='hint'; p.textContent='Cargando recetas…';
    app.appendChild(p);
  } else {
    app.appendChild(renderGrid());
  }
  if(state.modal === 'add') app.appendChild(renderAddModal());
  if(state.modal === 'detail') app.appendChild(renderDetailModal());
}

function renderLogin(){
  const w = document.createElement('div'); w.className='loginwrap';
  w.innerHTML = `<h1>Recetario</h1><p>Introduce el PIN de la familia para entrar</p>`;
  const inp = document.createElement('input'); inp.type='password'; inp.maxLength=12; inp.placeholder='••••';
  const btn = document.createElement('button'); btn.textContent='Entrar';
  const err = document.createElement('div'); err.className='loginerr'; err.textContent=state.loginErr;
  const go = ()=> login(inp.value);
  btn.onclick = go;
  inp.onkeydown = (e)=>{ if(e.key==='Enter') go(); };
  w.appendChild(inp); w.appendChild(btn); w.appendChild(err);
  return w;
}

function renderHeader(){
  const wrap = document.createElement('div');
  const top = document.createElement('div'); top.className='top';
  top.innerHTML = `<div><h1>Recetario</h1><div class="sub">Recetas de fotos, vídeos y enlaces, buscables por ingrediente.</div></div>`;
  const btn = document.createElement('button'); btn.className='newbtn'; btn.textContent='+ Nueva receta';
  btn.onclick = ()=>{ state.modal='add'; state.addStep='source'; state.addSource=null; state.form=null; state.aiStatus=''; render(); };
  top.appendChild(btn);
  wrap.appendChild(top);

  const searchrow = document.createElement('div'); searchrow.className='searchrow';
  const input = document.createElement('input'); input.type='text'; input.placeholder='Buscar por título…'; input.value=state.query;
  input.oninput = (e)=>{ state.query = e.target.value; render(); };
  searchrow.appendChild(input);
  wrap.appendChild(searchrow);

  const allTags = new Set();
  state.recipes.forEach(r => (r.ingredientes||[]).forEach(t => allTags.add(t)));
  const tagbar = document.createElement('div'); tagbar.className='tagbar';
  if(allTags.size===0){
    const s = document.createElement('span'); s.className='chip empty'; s.textContent='sin ingredientes aún';
    tagbar.appendChild(s);
  }
  [...allTags].sort().forEach(tag=>{
    const c = document.createElement('button'); c.className='chip'+(state.activeTags.has(tag)?' on':''); c.textContent=tag;
    c.onclick = ()=>{ state.activeTags.has(tag)?state.activeTags.delete(tag):state.activeTags.add(tag); render(); };
    tagbar.appendChild(c);
  });
  wrap.appendChild(tagbar);
  return wrap;
}

function filteredList(){
  return state.recipes.filter(r=>{
    if(state.query && !r.titulo.toLowerCase().includes(state.query.toLowerCase())) return false;
    for(const t of state.activeTags){ if(!(r.ingredientes||[]).includes(t)) return false; }
    return true;
  });
}

function renderGrid(){
  const items = filteredList();
  if(items.length===0){
    const e = document.createElement('div'); e.className='empty-state';
    e.innerHTML = `<h3>Aún no hay recetas guardadas</h3><p>Añade la primera desde una foto, un vídeo de YouTube o un enlace.</p>`;
    return e;
  }
  const grid = document.createElement('div'); grid.className='grid';
  items.forEach(r=>{
    const c = document.createElement('div'); c.className='card';
    c.onclick = ()=>{ state.selected=r; state.modal='detail'; render(); };
    const kindLabel = {foto:'Foto', youtube:'YouTube', link:'Enlace', manual:'Manual'}[r.origen] || r.origen;
    c.innerHTML = `
      <div class="kind">${kindLabel}</div>
      <h3>${escapeHtml(r.titulo)}</h3>
      <div class="tagsmini">${(r.ingredientes||[]).slice(0,5).map(t=>`<span>${escapeHtml(t)}</span>`).join('')}</div>
    `;
    grid.appendChild(c);
  });
  return grid;
}

// ---------- add modal ----------
function renderAddModal(){
  const overlay = document.createElement('div'); overlay.className='overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay){ state.modal=null; render(); } };
  const modal = document.createElement('div'); modal.className='modal';
  overlay.appendChild(modal);
  const close = document.createElement('button'); close.className='closebtn'; close.innerHTML='&times;';
  close.onclick = ()=>{ state.modal=null; render(); };
  modal.appendChild(close);
  const h = document.createElement('h2'); h.textContent='Nueva receta'; modal.appendChild(h);

  if(state.addStep === 'source'){
    const p = document.createElement('div'); p.className='hint'; p.textContent='¿De dónde viene la receta?';
    modal.appendChild(p);
    const choice = document.createElement('div'); choice.className='sourcechoice';
    [['foto','📷 Foto'],['youtube','▶ YouTube'],['link','🔗 Enlace / texto'],['manual','✍ Manual']].forEach(([k,label])=>{
      const b = document.createElement('button'); b.textContent = label;
      b.onclick = ()=>{
        state.addSource = k; state.addStep = 'form';
        state.form = { titulo:'', ingredientes:[], pasos:[], origen:k, sourceUrl:'', imageB64:'', imageMime:'', videoId:'', rawText:'' };
        render();
      };
      choice.appendChild(b);
    });
    modal.appendChild(choice);
    return overlay;
  }
  modal.appendChild(renderForm());
  return overlay;
}

function renderForm(){
  const box = document.createElement('div');
  const f = state.form;

  if(f.origen === 'foto'){
    const field = document.createElement('div'); field.className='field'; field.innerHTML=`<label>Foto de la receta</label>`;
    const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange = async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      f.imageMime = file.type; f.imageB64 = await fileToBase64(file);
      state.aiStatus = 'Foto cargada. Pulsa "Leer receta con IA".'; render();
    };
    field.appendChild(inp); box.appendChild(field);
    if(f.imageB64){
      const img = document.createElement('img');
      img.src = `data:${f.imageMime};base64,${f.imageB64}`;
      img.style.width='100%'; img.style.borderRadius='4px'; img.style.marginBottom='12px'; img.style.border='1.3px solid var(--ink)';
      box.appendChild(img);
    }
    const aiBtn = document.createElement('button'); aiBtn.className='aibtn'; aiBtn.textContent='Leer receta con IA';
    aiBtn.disabled = !f.imageB64;
    aiBtn.onclick = async ()=>{
      state.aiStatus='Leyendo la foto…'; render();
      try{
        const parsed = await api('/api/analyze', { method:'POST', body: JSON.stringify({ image_base64: f.imageB64, image_mime: f.imageMime }) });
        f.titulo = parsed.titulo || f.titulo;
        f.ingredientes = (parsed.ingredientes||[]).map(normTag);
        f.pasos = parsed.pasos || [];
        state.aiStatus = 'Listo. Revisa y ajusta antes de guardar.';
      }catch(e){ state.aiStatus = 'No se pudo leer la foto: ' + e.message; }
      render();
    };
    box.appendChild(aiBtn);
  }

  if(f.origen === 'youtube'){
    const field = document.createElement('div'); field.className='field'; field.innerHTML=`<label>URL del vídeo</label>`;
    const inp = document.createElement('input'); inp.type='url'; inp.placeholder='https://www.youtube.com/watch?v=...'; inp.value=f.sourceUrl;
    inp.oninput = (e)=>{ f.sourceUrl = e.target.value; f.videoId = extractYoutubeId(e.target.value); };
    field.appendChild(inp); box.appendChild(field);

    const field2 = document.createElement('div'); field2.className='field'; field2.innerHTML=`<label>Transcripción (opcional)</label>`;
    const ta = document.createElement('textarea'); ta.placeholder='Pega aquí la transcripción o la descripción del vídeo'; ta.value=f.rawText;
    ta.oninput = (e)=>{ f.rawText = e.target.value; };
    field2.appendChild(ta); box.appendChild(field2);

    const aiBtn = document.createElement('button'); aiBtn.className='aibtn'; aiBtn.textContent='Estructurar con IA';
    aiBtn.onclick = async ()=>{
      if(!f.rawText.trim()){ state.aiStatus='Pega texto primero.'; render(); return; }
      state.aiStatus='Analizando…'; render();
      try{
        const parsed = await api('/api/analyze', { method:'POST', body: JSON.stringify({ text: f.rawText }) });
        f.titulo = parsed.titulo || f.titulo;
        f.ingredientes = (parsed.ingredientes||[]).map(normTag);
        f.pasos = parsed.pasos || [];
        state.aiStatus = 'Listo. Revisa y ajusta antes de guardar.';
      }catch(e){ state.aiStatus = 'No se pudo procesar: ' + e.message; }
      render();
    };
    box.appendChild(aiBtn);
  }

  if(f.origen === 'link'){
    const field = document.createElement('div'); field.className='field'; field.innerHTML=`<label>Enlace (opcional)</label>`;
    const inp = document.createElement('input'); inp.type='url'; inp.placeholder='https://…'; inp.value=f.sourceUrl;
    inp.oninput = (e)=>{ f.sourceUrl = e.target.value; };
    field.appendChild(inp); box.appendChild(field);

    const field2 = document.createElement('div'); field2.className='field'; field2.innerHTML=`<label>Texto de la receta</label>`;
    const ta = document.createElement('textarea'); ta.placeholder='Pega aquí el texto de la receta'; ta.value=f.rawText;
    ta.oninput = (e)=>{ f.rawText = e.target.value; };
    field2.appendChild(ta); box.appendChild(field2);

    const aiBtn = document.createElement('button'); aiBtn.className='aibtn'; aiBtn.textContent='Estructurar con IA';
    aiBtn.onclick = async ()=>{
      if(!f.rawText.trim()){ state.aiStatus='Pega texto primero.'; render(); return; }
      state.aiStatus='Analizando…'; render();
      try{
        const parsed = await api('/api/analyze', { method:'POST', body: JSON.stringify({ text: f.rawText }) });
        f.titulo = parsed.titulo || f.titulo;
        f.ingredientes = (parsed.ingredientes||[]).map(normTag);
        f.pasos = parsed.pasos || [];
        state.aiStatus = 'Listo. Revisa y ajusta antes de guardar.';
      }catch(e){ state.aiStatus = 'No se pudo procesar: ' + e.message; }
      render();
    };
    box.appendChild(aiBtn);
  }

  const statusEl = document.createElement('div');
  statusEl.className = 'status' + (state.aiStatus.startsWith('No se pudo') ? ' err':'');
  statusEl.textContent = state.aiStatus;
  box.appendChild(statusEl);

  const tField = document.createElement('div'); tField.className='field'; tField.innerHTML=`<label>Título</label>`;
  const tInp = document.createElement('input'); tInp.type='text'; tInp.value=f.titulo; tInp.placeholder='Nombre de la receta';
  tInp.oninput = (e)=>{ f.titulo = e.target.value; };
  tField.appendChild(tInp); box.appendChild(tField);

  box.appendChild(renderEditableList('Ingredientes (etiquetas de búsqueda)', f.ingredientes, 'ingrediente', normTag));
  box.appendChild(renderEditableList('Pasos', f.pasos, 'paso', s=>s));

  const savebar = document.createElement('div'); savebar.className='savebar';
  const saveBtn = document.createElement('button'); saveBtn.className='savebtn'; saveBtn.textContent='Guardar receta';
  saveBtn.onclick = async ()=>{
    if(!f.titulo.trim()){ state.aiStatus='Ponle un título a la receta.'; render(); return; }
    saveBtn.disabled = true; saveBtn.textContent='Guardando…';
    try{
      await api('/api/recipes', { method:'POST', body: JSON.stringify({
        titulo: f.titulo.trim(),
        ingredientes: f.ingredientes.map(normTag).filter(Boolean),
        pasos: f.pasos.filter(Boolean),
        origen: f.origen,
        source_url: f.sourceUrl,
        video_id: f.origen==='youtube' ? extractYoutubeId(f.sourceUrl) : '',
        image_base64: f.origen==='foto' ? f.imageB64 : '',
        image_mime: f.origen==='foto' ? f.imageMime : '',
      })});
      state.modal = null;
      await loadAll();
    }catch(e){
      state.aiStatus = 'No se pudo guardar: ' + e.message;
      saveBtn.disabled = false; saveBtn.textContent='Guardar receta';
      render();
    }
  };
  savebar.appendChild(saveBtn);
  box.appendChild(savebar);
  return box;
}

function renderEditableList(label, arr, placeholder, normalizer){
  const field = document.createElement('div'); field.className='field';
  const lab = document.createElement('label'); lab.textContent = label; field.appendChild(lab);
  const listEl = document.createElement('div'); listEl.className='listedit';
  function draw(){
    listEl.innerHTML = '';
    arr.forEach((val,i)=>{
      const row = document.createElement('div'); row.className='row';
      const inp = document.createElement('input'); inp.type='text'; inp.value=val;
      inp.oninput = (e)=>{ arr[i] = e.target.value; };
      inp.onblur = ()=>{ if(normalizer) arr[i] = normalizer(arr[i]); };
      const rm = document.createElement('button'); rm.className='rm'; rm.textContent='×';
      rm.onclick = ()=>{ arr.splice(i,1); draw(); };
      row.appendChild(inp); row.appendChild(rm);
      listEl.appendChild(row);
    });
    const add = document.createElement('button'); add.className='addline'; add.textContent='+ añadir '+placeholder;
    add.onclick = ()=>{ arr.push(''); draw(); };
    listEl.appendChild(add);
  }
  draw();
  field.appendChild(listEl);
  return field;
}

function renderDetailModal(){
  const r = state.selected;
  const overlay = document.createElement('div'); overlay.className='overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay){ state.modal=null; render(); } };
  const modal = document.createElement('div'); modal.className='modal';
  overlay.appendChild(modal);
  const close = document.createElement('button'); close.className='closebtn'; close.innerHTML='&times;';
  close.onclick = ()=>{ state.modal=null; render(); };
  modal.appendChild(close);
  const h = document.createElement('h2'); h.textContent = r.titulo; modal.appendChild(h);

  if(r.origen==='foto' && r.image_url){
    const d = document.createElement('div'); d.className='detail-media';
    d.innerHTML = `<img src="${r.image_url}">`;
    modal.appendChild(d);
  }
  if(r.origen==='youtube' && r.video_id){
    const d = document.createElement('div'); d.className='detail-media';
    d.innerHTML = `<iframe src="https://www.youtube.com/embed/${r.video_id}" allowfullscreen></iframe>`;
    modal.appendChild(d);
  }

  const tags = document.createElement('div'); tags.className='detail-tags';
  (r.ingredientes||[]).forEach(t=>{ const s=document.createElement('span'); s.className='chip'; s.textContent=t; tags.appendChild(s); });
  modal.appendChild(tags);

  const cols = document.createElement('div'); cols.className='detail-cols';
  cols.innerHTML = `
    <div><h4>Ingredientes</h4><ul>${(r.ingredientes||[]).map(i=>`<li>${escapeHtml(i)}</li>`).join('')}</ul></div>
    <div><h4>Pasos</h4><ol>${(r.pasos||[]).map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ol></div>
  `;
  modal.appendChild(cols);

  if(r.source_url){
    const a = document.createElement('a'); a.className='srclink'; a.href=r.source_url; a.target='_blank';
    a.textContent = 'Ver fuente original ↗';
    modal.appendChild(a);
  }

  const bar = document.createElement('div'); bar.className='detailbar';
  const del = document.createElement('button'); del.className='delbtn'; del.textContent='Eliminar receta';
  del.onclick = async ()=>{
    state.modal=null; render();
    try{ await api('/api/recipes/'+r.id, { method:'DELETE' }); }catch(e){}
    await loadAll();
  };
  bar.appendChild(del);
  modal.appendChild(bar);
  return overlay;
}

if(token){ loadAll(); } else { render(); }
</script>
</body>
</html>
