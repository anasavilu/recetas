<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recetario</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap');

:root{
  --paper:#EEF0E2;
  --paper-card:#F7F8EF;
  --ink:#23261F;
  --ink-soft:#5B5F51;
  --accent:#D8A13A;
  --accent-ink:#3A2A08;
  --herb:#4E6E4E;
  --herb-ink:#F7F8EF;
  --herb-tint:#E1E8CF;
  --line:#C7C2A9;
  --danger:#B4483A;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper);
  background-image: radial-gradient(var(--line) 0.6px, transparent 0.6px);
  background-size: 18px 18px;
  color:var(--ink); font-family:'Space Grotesk', sans-serif; min-height:100vh;
}
h1,h2,h3{font-family:'Fraunces', serif; margin:0; font-weight:600;}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:2px solid var(--herb); outline-offset:2px;}
.wrap{max-width:980px; margin:0 auto; padding:28px 20px 80px;}

/* acceso y perfiles */
.loginwrap{max-width:380px; margin:80px auto; text-align:center;}
.loginwrap h1{font-size:2rem; margin-bottom:6px;}
.loginwrap p{color:var(--ink-soft); font-size:0.88rem; margin:0 0 20px;}
.loginwrap input{width:100%; padding:12px; border:1.5px solid var(--ink); border-radius:4px; font-size:1.1rem; text-align:center; margin-bottom:12px; background:var(--paper-card); font-family:inherit; color:var(--ink);}
.loginwrap input.pin{letter-spacing:0.2em;}
.loginwrap button.main{width:100%; background:var(--accent); color:var(--accent-ink); border:1.5px solid var(--ink); padding:11px; border-radius:4px; font-weight:600; box-shadow:3px 3px 0 var(--ink);}
.loginerr{color:var(--danger); font-size:0.85rem; min-height:1.2em; margin-top:8px;}
.perfiles{display:flex; flex-direction:column; gap:10px; margin-bottom:22px;}
.perfilbtn{padding:14px; border:1.5px solid var(--ink); border-radius:4px; background:var(--paper-card); font-family:'Fraunces', serif; font-size:1.2rem; box-shadow:3px 3px 0 var(--line); color:var(--ink);}
.perfilbtn:hover{box-shadow:3px 3px 0 var(--ink);}
.newperfil{border-top:1.5px dashed var(--line); padding-top:18px;}
.newperfil p{margin-bottom:10px;}
.linkbtn{background:none; border:none; color:var(--ink-soft); text-decoration:underline; font-size:0.82rem; padding:0;}

/* cabecera */
.top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
.top h1{font-size:2.1rem; letter-spacing:-0.01em;}
.top .who{color:var(--ink-soft); font-size:0.85rem; margin-top:4px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.top .who strong{color:var(--ink);}
.newbtn{background:var(--accent); color:var(--accent-ink); border:1.5px solid var(--ink); padding:10px 16px; font-size:0.95rem; font-weight:600; border-radius:3px; box-shadow:3px 3px 0 var(--ink);}
.newbtn:active{box-shadow:1px 1px 0 var(--ink); transform:translate(2px,2px);}

.tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.tab{padding:7px 14px; border:1.5px solid var(--ink); border-radius:3px; background:transparent; font-size:0.85rem; color:var(--ink);}
.tab.active{background:var(--ink); color:var(--paper-card);}

.searchrow{display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
.searchrow input[type=text]{flex:1; min-width:200px; padding:9px 12px; border:1.5px solid var(--ink); border-radius:3px; background:var(--paper-card); font-family:inherit; font-size:0.9rem; color:var(--ink);}

.tagrow{display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
.tagrow .lbl{font-size:0.75rem; color:var(--ink-soft); margin-right:4px; min-width:70px;}
.chip{padding:5px 12px; border:1.3px solid var(--ink); border-radius:999px; font-size:0.78rem; background:transparent; color:var(--ink); font-family:inherit;}
.chip.cat{background:var(--herb-tint); border-color:var(--herb); color:var(--herb);}
.chip.on{background:var(--herb); color:var(--herb-ink); border-color:var(--herb);}
.chip.empty{border-style:dashed; color:var(--ink-soft);}
.filters{margin-bottom:22px;}

/* tarjetas */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:18px;}
.card{background:var(--paper-card); border:1.5px solid var(--ink); border-radius:4px; padding:14px; box-shadow:4px 4px 0 var(--line); cursor:pointer; display:flex; flex-direction:column; gap:8px; min-height:150px;}
.card:nth-child(3n+1){transform:rotate(-0.4deg);}
.card:nth-child(3n+2){transform:rotate(0.3deg);}
.card:hover{box-shadow:4px 4px 0 var(--ink);}
.card .kind{font-size:0.72rem; color:var(--ink-soft);}
.card .kind .badge{color:var(--herb); font-weight:600;}
.card h3{font-size:1.15rem; line-height:1.2;}
.card .tagsmini{display:flex; flex-wrap:wrap; gap:4px; margin-top:auto;}
.card .tagsmini span{font-size:0.7rem; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:2px 8px; color:var(--ink-soft);}
.card .tagsmini span.cat{background:var(--herb-tint); border-color:var(--herb); color:var(--herb);}

.empty-state{border:1.5px dashed var(--line); border-radius:4px; padding:40px 20px; text-align:center; color:var(--ink-soft);}
.empty-state h3{color:var(--ink); margin-bottom:8px;}

/* ventanas */
.overlay{position:fixed; inset:0; background:rgba(35,38,31,0.55); display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto; z-index:50;}
.modal{background:var(--paper-card); border:1.5px solid var(--ink); border-radius:6px; max-width:640px; width:100%; padding:24px; box-shadow:6px 6px 0 var(--ink); margin-bottom:40px;}
.modal h2{font-size:1.5rem; margin-bottom:14px;}
.closebtn{float:right; border:none; background:none; font-size:1.3rem; color:var(--ink-soft); line-height:1;}

.field{margin-bottom:14px;}
.field > label{display:block; font-size:0.8rem; color:var(--ink-soft); margin-bottom:5px;}
.field input[type=text], .field input[type=url], .field textarea{width:100%; padding:9px 11px; border:1.3px solid var(--line); border-radius:3px; font-family:inherit; font-size:0.9rem; background:var(--paper); color:var(--ink); resize:vertical;}
.field textarea{min-height:90px;}

.sourcechoice{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.sourcechoice button{padding:9px 14px; border:1.5px solid var(--ink); border-radius:3px; background:transparent; font-size:0.85rem; color:var(--ink);}

.aibtn{background:var(--herb); color:var(--herb-ink); border:1.3px solid var(--herb); padding:9px 14px; border-radius:3px; font-size:0.85rem; font-weight:500;}
.aibtn:disabled{opacity:0.5; cursor:default;}

.listedit{display:flex; flex-direction:column; gap:6px;}
.listedit .row{display:flex; gap:6px;}
.listedit input{flex:1;}
.listedit button.rm{border:1px solid var(--line); background:none; color:var(--danger); border-radius:3px; width:30px;}
.addline{border:1.3px dashed var(--line); background:none; border-radius:3px; padding:6px; font-size:0.8rem; color:var(--ink-soft); text-align:left;}
.classifybox{border:1.3px dashed var(--herb); border-radius:4px; padding:12px; margin-bottom:14px; background:rgba(78,110,78,0.05);}
.classifybox .hint{margin:8px 0 0;}

.savebar{display:flex; align-items:center; justify-content:space-between; margin-top:18px; gap:10px; flex-wrap:wrap;}
.savebtn{background:var(--accent); color:var(--accent-ink); border:1.5px solid var(--ink); padding:9px 18px; border-radius:3px; font-weight:600; box-shadow:3px 3px 0 var(--ink);}
.savebtn:disabled{opacity:0.6;}

.sharetoggle{display:flex; align-items:center; gap:8px; font-size:0.82rem; color:var(--ink-soft);}
.switch{width:36px; height:20px; border-radius:999px; border:1.3px solid var(--ink); position:relative; background:var(--paper); padding:0; flex:none;}
.switch.on{background:var(--herb); border-color:var(--herb);}
.switch .dot{position:absolute; top:1px; left:1px; width:15px; height:15px; border-radius:50%; background:var(--ink); transition:transform .15s;}
.switch.on .dot{background:var(--herb-ink); transform:translateX(16px);}

/* detalle */
.detail-media{margin-bottom:16px;}
.detail-media img{width:100%; border:1.3px solid var(--ink); border-radius:4px; display:block;}
.detail-media iframe{width:100%; aspect-ratio:16/9; border:1.3px solid var(--ink); border-radius:4px;}
.detail-tags{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px;}
.detail-cols{display:grid; grid-template-columns:1fr 1.4fr; gap:22px;}
@media(max-width:560px){.detail-cols{grid-template-columns:1fr;}}
.detail-cols h4{font-size:0.85rem; color:var(--ink-soft); margin:0 0 8px; font-weight:600;}
.detail-cols ul, .detail-cols ol{padding-left:18px; margin:0; display:flex; flex-direction:column; gap:6px; font-size:0.92rem;}
.srclink{font-size:0.8rem; color:var(--ink-soft); margin-top:16px; display:block;}
.notebox{margin-top:18px; display:flex; flex-direction:column; gap:6px;}
.notebox h4{margin:0;}
.notebox textarea{width:100%; min-height:70px; padding:9px 11px; border:1.3px solid var(--line); border-radius:3px; font-family:inherit; font-size:0.9rem; background:var(--paper); color:var(--ink); resize:vertical;}
.notebox .notestate{font-size:0.75rem; color:var(--ink-soft); min-height:1em;}
.detailbar{display:flex; justify-content:space-between; align-items:center; margin-top:18px; flex-wrap:wrap; gap:10px;}
.delbtn{border:1.3px solid var(--danger); color:var(--danger); background:none; padding:7px 12px; border-radius:3px; font-size:0.8rem;}
.sharecol{display:flex; flex-direction:column; gap:10px; flex:1; min-width:240px;}
.linkrow{display:flex; gap:6px; align-items:center;}
.linkrow input{flex:1; min-width:0; padding:7px 9px; border:1.3px solid var(--line); border-radius:3px; font-family:inherit; font-size:0.8rem; background:var(--paper); color:var(--ink);}
.verbox a{color:var(--herb); font-weight:600;}
.sharecol .hint{margin:0;}
.sharebox{display:flex; flex-direction:column; gap:8px;}
.permlist .hint{margin:0 0 6px;}
.savebtn{margin-left:auto;}

.hint{font-size:0.78rem; color:var(--ink-soft); margin-bottom:12px; line-height:1.4;}
.fotogrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; margin:10px 0;}
.fotocell{position:relative; aspect-ratio:1; border:1.3px solid var(--ink); border-radius:4px; overflow:hidden; background:var(--paper-card);}
.fotocell img{width:100%; height:100%; object-fit:cover; display:block;}
.fotorm{position:absolute; top:4px; right:4px; width:26px; height:26px; border-radius:50%; border:1.3px solid var(--ink); background:var(--paper); color:var(--ink); font-size:1rem; line-height:1; padding:0; cursor:pointer;}
.fotoportada{position:absolute; left:4px; bottom:4px; background:var(--ink); color:var(--paper); font-size:0.65rem; padding:2px 6px; border-radius:3px;}
.status{font-size:0.8rem; color:var(--herb); margin:10px 0; min-height:1em;}
.status.good{font-weight:600; font-size:0.9rem;}
.grabbox{border:1.5px dashed var(--ink); border-radius:4px; padding:12px; margin:12px 0; background:var(--paper-card);}
.grabbox p{margin:0 0 8px; font-size:0.85rem; line-height:1.4;}
.err{color:var(--danger);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const app = document.getElementById('app');

// Mismas categorías que en server.js
const CATEGORIAS = [
  'pescado','marisco','carne','aves','embutido','huevos','lácteos',
  'verdura','fruta','legumbres','arroz','pasta','pan y masas','cereales',
  'frutos secos','salsas y condimentos','especias y hierbas','aceites y grasas','dulces',
];

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

let token = lsGet('recetario_token');
let perfil = lsGet('recetario_perfil');

let state = {
  perfiles: [],
  recipes: [],
  tab: 'mias',            // mias | familia
  activeCats: new Set(),
  activeTags: new Set(),
  showIng: false,
  query: '',
  modal: null,            // add | detail
  selected: null,
  addStep: 'source',
  form: null,
  loading: true,
  aiStatus: '',
  loginErr: '',
  perfilErr: '',
};

// ---------- utilidades ----------
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function normTag(t){ return (t||'').toLowerCase().trim().replace(/^(el|la|los|las|un|una)\s+/,''); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
// Reconoce enlaces de YouTube normales, cortos, Shorts, embed y con parámetros extra (?app=desktop&v=...)
function extractYoutubeId(url){
  try{
    const u = new URL(String(url||'').trim());
    const h = u.hostname.replace(/^www\.|^m\.|^music\./,'');
    let id = null;
    if(h === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
    else if(h === 'youtube.com'){
      if(u.pathname === '/watch') id = u.searchParams.get('v');
      else { const m = u.pathname.match(/^\/(?:embed|shorts|live)\/([^/?#]+)/); if(m) id = m[1]; }
    }
    return id && /^[\w-]{6,}$/.test(id) ? id : null;
  }catch(e){ return null; }
}
// Reduce la foto (máx. 1600 px, JPEG) para que varias fotos quepan en una sola petición. Si el navegador no puede, se usa la original.
async function prepararFoto(file){
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.85);
    return { b64: url.split(',')[1], mime: 'image/jpeg' };
  }catch(e){
    return { b64: await fileToBase64(file), mime: file.type || 'image/jpeg' };
  }
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text!=null) e.textContent = text;
  return e;
}

// ---------- API ----------
async function api(path, opts={}){
  const headers = { 'Content-Type':'application/json', 'x-app-token': token || '' };
  if(perfil) headers['x-perfil'] = encodeURIComponent(perfil);
  const res = await fetch(path, { ...opts, headers: { ...headers, ...(opts.headers||{}) } });
  const data = await res.json().catch(()=>({}));
  if(res.status === 401 && path !== '/api/login'){
    token = null; lsDel('recetario_token');
    render();
    throw new Error('Sesión caducada, vuelve a introducir el PIN');
  }
  if(res.status === 403 && data.code === 'perfil'){
    perfil = null; lsDel('recetario_perfil');
    await loadPerfiles();
    render();
    throw new Error(data.error || 'Elige un perfil');
  }
  if(!res.ok) throw new Error(data.error || 'Error de servidor');
  return data;
}

async function login(pin){
  state.loginErr = '';
  try{
    const data = await api('/api/login', { method:'POST', body: JSON.stringify({ pin }) });
    token = data.token;
    lsSet('recetario_token', token);
    await boot();
  }catch(e){ state.loginErr = e.message; render(); }
}

async function loadPerfiles(){
  try{ state.perfiles = (await api('/api/perfiles')).map(p=>p.nombre); }
  catch(e){ state.perfiles = []; }
}

async function boot(){
  if(!token){ render(); return; }
  await loadPerfiles();
  if(perfil && !state.perfiles.includes(perfil)){ perfil = null; lsDel('recetario_perfil'); }
  if(perfil){ await loadAll(); } else { render(); }
}

async function elegirPerfil(nombre){
  perfil = nombre; lsSet('recetario_perfil', nombre);
  state.tab = 'mias'; state.activeCats = new Set(); state.activeTags = new Set(); state.query = '';
  await loadAll();
}

async function crearPerfil(nombre){
  state.perfilErr = '';
  try{
    await api('/api/perfiles', { method:'POST', body: JSON.stringify({ nombre }) });
    await loadPerfiles();
    await elegirPerfil(nombre.trim());
  }catch(e){ state.perfilErr = e.message; render(); }
}

function cambiarPerfil(){
  perfil = null; lsDel('recetario_perfil');
  state.modal = null; state.recipes = [];
  boot();
}

async function loadAll(){
  state.loading = true; render();
  try{ state.recipes = await api('/api/recipes'); }
  catch(e){ state.recipes = []; }
  state.loading = false;
  render();
}

// ---------- datos derivados ----------
function listForTab(){
  return state.recipes.filter(r => state.tab === 'mias' ? r.propietario === perfil : r.propietario !== perfil);
}
function filtered(){
  const q = norm(state.query.trim());
  return listForTab().filter(r=>{
    if(q){
      const hay = norm([r.titulo, ...(r.etiquetas||[]), ...(r.categorias||[])].join(' '));
      if(!hay.includes(q)) return false;
    }
    for(const c of state.activeCats){ if(!(r.categorias||[]).includes(c)) return false; }
    for(const t of state.activeTags){ if(!(r.etiquetas||[]).includes(t)) return false; }
    return true;
  });
}

// ---------- render ----------
function render(){
  const prev = document.querySelector('.overlay');
  const scroll = prev ? prev.scrollTop : 0;
  app.innerHTML = '';
  if(!token){ app.appendChild(renderLogin()); return; }
  if(!perfil){ app.appendChild(renderPerfiles()); return; }
  app.appendChild(renderHeader());
  const results = el('div'); results.id = 'results';
  app.appendChild(results);
  fillResults();
  if(state.modal === 'add') app.appendChild(renderAddModal());
  if(state.modal === 'detail') app.appendChild(renderDetailModal());
  const ov = document.querySelector('.overlay');
  if(ov) ov.scrollTop = scroll;
}

function fillResults(){
  const box = document.getElementById('results');
  if(!box) return;
  box.innerHTML = '';
  if(state.loading){ box.appendChild(el('div','hint','Cargando recetas…')); return; }
  box.appendChild(renderGrid());
}

function renderLogin(){
  const w = el('div','loginwrap');
  w.appendChild(el('h1',null,'Recetario'));
  w.appendChild(el('p',null,'Introduce el PIN de la familia para entrar'));
  const inp = el('input','pin'); inp.type='password'; inp.maxLength=12; inp.placeholder='••••';
  const btn = el('button','main','Entrar');
  const err = el('div','loginerr', state.loginErr);
  const go = ()=> login(inp.value);
  btn.onclick = go;
  inp.onkeydown = (e)=>{ if(e.key==='Enter') go(); };
  w.append(inp, btn, err);
  setTimeout(()=>inp.focus(), 0);
  return w;
}

function renderPerfiles(){
  const w = el('div','loginwrap');
  w.appendChild(el('h1',null,'¿Quién eres?'));
  w.appendChild(el('p',null, state.perfiles.length ? 'Elige tu perfil para ver tus recetas' : 'Crea tu perfil para empezar'));
  if(state.perfiles.length){
    const list = el('div','perfiles');
    state.perfiles.forEach(n=>{
      const b = el('button','perfilbtn', n);
      b.onclick = ()=> elegirPerfil(n);
      list.appendChild(b);
    });
    w.appendChild(list);
  }
  const nuevo = el('div', state.perfiles.length ? 'newperfil' : '');
  nuevo.appendChild(el('p',null, state.perfiles.length ? 'Añadir otro perfil' : ''));
  const inp = el('input'); inp.type='text'; inp.maxLength=30; inp.placeholder='Tu nombre';
  const btn = el('button','main','Crear perfil');
  const err = el('div','loginerr', state.perfilErr);
  const go = ()=>{ if(inp.value.trim()) crearPerfil(inp.value); };
  btn.onclick = go;
  inp.onkeydown = (e)=>{ if(e.key==='Enter') go(); };
  nuevo.append(inp, btn, err);
  w.appendChild(nuevo);
  const salir = el('button','linkbtn','Salir (cambiar PIN)');
  salir.style.marginTop = '18px';
  salir.onclick = ()=>{ token=null; lsDel('recetario_token'); render(); };
  w.appendChild(salir);
  return w;
}

function chip(label, cls, on, onclick){
  const c = el('button', 'chip' + (cls?' '+cls:'') + (on?' on':''), label);
  c.onclick = onclick;
  return c;
}

function renderHeader(){
  const wrap = el('div');

  const top = el('div','top');
  const left = el('div');
  left.appendChild(el('h1',null,'Recetario'));
  const who = el('div','who');
  const hola = el('span'); hola.innerHTML = 'Perfil: <strong>'+escapeHtml(perfil)+'</strong>';
  const cambiar = el('button','linkbtn','cambiar');
  cambiar.onclick = cambiarPerfil;
  who.append(hola, cambiar);
  left.appendChild(who);
  top.appendChild(left);
  const btn = el('button','newbtn','+ Nueva receta');
  btn.onclick = async ()=>{ await loadPerfiles(); state.modal='add'; state.addStep='source'; state.form=null; state.aiStatus=''; render(); };
  top.appendChild(btn);
  wrap.appendChild(top);

  const tabs = el('div','tabs');
  const mias = state.recipes.filter(r=>r.propietario===perfil).length;
  const fam = state.recipes.length - mias;
  [['mias','Mis recetas ('+mias+')'],['familia','Compartidas conmigo ('+fam+')']].forEach(([k,label])=>{
    const b = el('button','tab'+(state.tab===k?' active':''), label);
    b.onclick = ()=>{ state.tab=k; state.activeCats=new Set(); state.activeTags=new Set(); render(); };
    tabs.appendChild(b);
  });
  wrap.appendChild(tabs);

  const searchrow = el('div','searchrow');
  const input = el('input'); input.type='text'; input.placeholder='Buscar por título o ingrediente…'; input.value=state.query;
  input.oninput = (e)=>{ state.query = e.target.value; fillResults(); };
  searchrow.appendChild(input);
  wrap.appendChild(searchrow);

  // filtros: categorías generales + ingredientes concretos
  const base = listForTab();
  const cats = new Set(), tags = new Set();
  base.forEach(r=>{ (r.categorias||[]).forEach(c=>cats.add(c)); (r.etiquetas||[]).forEach(t=>tags.add(t)); });
  const filters = el('div','filters');

  const rowC = el('div','tagrow');
  rowC.appendChild(el('span','lbl','Tipo'));
  if(cats.size===0) rowC.appendChild(el('span','chip empty','aún sin categorías'));
  CATEGORIAS.filter(c=>cats.has(c)).forEach(c=>{
    rowC.appendChild(chip(c,'cat', state.activeCats.has(c), ()=>{ state.activeCats.has(c)?state.activeCats.delete(c):state.activeCats.add(c); render(); }));
  });
  filters.appendChild(rowC);

  const rowT = el('div','tagrow');
  rowT.appendChild(el('span','lbl','Ingrediente'));
  const toggle = el('button','linkbtn', state.showIng ? 'ocultar' : 'ver los '+tags.size+' ingredientes');
  toggle.onclick = ()=>{ state.showIng = !state.showIng; render(); };
  if(tags.size===0){
    rowT.appendChild(el('span','chip empty','aún sin etiquetas'));
  } else if(state.showIng || state.activeTags.size){
    [...new Set([...state.activeTags, ...[...tags].sort()])].forEach(t=>{
      rowT.appendChild(chip(t,'', state.activeTags.has(t), ()=>{ state.activeTags.has(t)?state.activeTags.delete(t):state.activeTags.add(t); render(); }));
    });
    rowT.appendChild(toggle);
  } else {
    rowT.appendChild(toggle);
  }
  filters.appendChild(rowT);
  wrap.appendChild(filters);
  return wrap;
}

function applyParsed(f, p){
  f.titulo = p.titulo || f.titulo;
  f.raciones = p.raciones || f.raciones;
  f.ingredientes = p.ingredientes || [];
  f.etiquetas = (p.etiquetas||[]).map(normTag).filter(Boolean);
  f.categorias = (p.categorias||[]).filter(c=>CATEGORIAS.includes(c));
  f.pasos = p.pasos || [];
}

async function analizar(f, body, fallo){
  state.aiStatus = 'Analizando…'; render();
  try{
    const p = await api('/api/analyze', { method:'POST', body: JSON.stringify(body) });
    applyParsed(f, p);
    state.aiStatus = 'Listo. Revisa y ajusta antes de guardar.';
  }catch(e){ state.aiStatus = fallo + e.message; }

}

async function clasificar(f){
  const ing = f.ingredientes.filter(Boolean);
  if(!ing.length){ state.aiStatus = 'Añade ingredientes primero.'; render(); return; }
  state.aiStatus = 'Generando etiquetas y categorías…'; render();
  try{
    const p = await api('/api/clasificar', { method:'POST', body: JSON.stringify({ ingredientes: ing }) });
    f.etiquetas = (p.etiquetas||[]).map(normTag).filter(Boolean);
    f.categorias = p.categorias || [];
    state.aiStatus = 'Etiquetas y categorías generadas. Revisa antes de guardar.';
  }catch(e){ state.aiStatus = 'No se pudo clasificar: ' + e.message; }
  render();
}


// ---------- audio de una grabación o de un archivo de audio ----------
// Se hace todo en el navegador: se decodifica el audio, se reduce a mono 16 kHz y se manda como WAV (pocos MB).
const MAX_AUDIO_SEG = 12 * 60;
function codificarWav(pcm, hz){
  const buf = new ArrayBuffer(44 + pcm.length * 2); const v = new DataView(buf);
  const txt = (o, s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  txt(0,'RIFF'); v.setUint32(4, 36 + pcm.length*2, true); txt(8,'WAVE'); txt(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,hz,true); v.setUint32(28,hz*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  txt(36,'data'); v.setUint32(40, pcm.length*2, true);
  for(let i=0;i<pcm.length;i++){ const x = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(44+i*2, x<0 ? x*0x8000 : x*0x7FFF, true); }
  return new Blob([buf], { type:'audio/wav' });
}
async function extraerAudioWav(file){
  const AC = window.AudioContext || window.webkitAudioContext;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if(!AC || !OAC) throw new Error('Este navegador no puede procesar audio. Prueba con Chrome o Safari actualizados.');
  const datos = await file.arrayBuffer();
  const ctx = new AC();
  let dec;
  try{
    dec = await new Promise((ok, ko)=>{ const p = ctx.decodeAudioData(datos, ok, ko); if(p && p.catch) p.catch(ko); });
  }catch(e){
    throw new Error('No he podido leer el audio de ese archivo. Prueba con una grabación de pantalla normal (mp4) o un audio (mp3, m4a, wav).');
  }finally{ try{ ctx.close(); }catch(e){} }
  if(dec.duration > MAX_AUDIO_SEG) throw new Error('El audio dura ' + Math.round(dec.duration/60) + ' min. El máximo es ' + (MAX_AUDIO_SEG/60) + ' min: recórtalo o graba solo la parte de la receta.');
  const hz = 16000;
  const off = new OAC(1, Math.max(1, Math.ceil(dec.duration * hz)), hz);
  const src = off.createBufferSource(); src.buffer = dec; src.connect(off.destination); src.start();
  const out = await off.startRendering();
  return codificarWav(out.getChannelData(0), hz);
}
async function transcribirArchivo(f, file){
  if(file.size > 400*1024*1024){ state.aiStatus = 'No se pudo transcribir: el archivo pesa demasiado (máx. 400 MB).'; render(); return; }
  state.aiStatus = 'Extrayendo el audio… (con vídeos largos puede tardar un poco)'; render();
  try{
    const wav = await extraerAudioWav(file);
    state.aiStatus = 'Transcribiendo el audio… (hasta un minuto)'; render();
    const headers = { 'Content-Type':'audio/wav', 'x-app-token': token || '' };
    if(perfil) headers['x-perfil'] = encodeURIComponent(perfil);
    const res = await fetch('/api/transcribir', { method:'POST', headers, body: wav });
    const data = await res.json().catch(()=>({}));
    if(res.status === 401){ token = null; lsDel('recetario_token'); render(); throw new Error('Sesión caducada, vuelve a introducir el PIN'); }
    if(!res.ok) throw new Error(data.error || 'Error de servidor');
    f.rawText = data.texto;
    f.pedirGrabacion = false;
    await analizar(f, { text: data.texto }, 'Transcrito, pero no se pudo estructurar: ');
    if(state.aiStatus.startsWith('Listo')) { state.aiStatus = '✅ OK: he leído la receta de la grabación. Revisa y ajusta antes de guardar.'; render(); }
  }catch(e){ state.aiStatus = 'No se pudo transcribir: ' + e.message; render(); }
}

const esVideoSocial = (u)=> /(^|\.)(tiktok|instagram|facebook)\.com|fb\.watch/i.test(String(u||'')) ;

async function importar(f){
  if(!f.sourceUrl.trim()){ state.aiStatus = 'Pega un enlace primero.'; render(); return; }
  state.aiStatus = 'Leyendo el enlace… (puede tardar unos segundos)'; render();
  try{
    const p = await api('/api/importar-url', { method:'POST', body: JSON.stringify({ url: f.sourceUrl.trim() }) });
    if(p.solo_video){
      // Sin receta escrita: el vídeo queda guardado y se pide adjuntar la grabación aquí mismo
      if(p.titulo) f.titulo = p.titulo;
      if(p.video_id) f.videoId = p.video_id;
      if(p.source_url) f.sourceUrl = p.source_url;
      f.pedirGrabacion = true;
      state.aiStatus = p.aviso;
      render(); return;
    }
    applyParsed(f, p);
    if(p.source_url) f.sourceUrl = p.source_url;
    f.pedirGrabacion = false;
    state.aiStatus = (f.origen === 'youtube' || esVideoSocial(f.sourceUrl)) ? '✅ OK: he leído la receta del vídeo. Revisa y ajusta antes de guardar.' : 'Listo. Revisa y ajusta antes de guardar.';
  }catch(e){ f.pedirGrabacion = (f.origen === 'youtube' || esVideoSocial(f.sourceUrl)); state.aiStatus = 'No se pudo leer el enlace: ' + e.message; }
  render();
}

// Selector de con quién compartir: "todos los perfiles" o solo perfiles concretos.
// "datos" ({compartida, con}) se modifica en sitio; "cambio" se llama después de cada cambio.
function renderCompartir(datos, cambio){
  const box = el('div','sharebox');
  const otros = state.perfiles.filter(n => n !== perfil);
  const lista = el('div','permlist');

  const wrapT = el('label','sharetoggle');
  const sw = el('button','switch'+(datos.compartida?' on':'')); sw.type='button';
  sw.setAttribute('role','switch'); sw.setAttribute('aria-checked', String(!!datos.compartida));
  sw.innerHTML = '<span class="dot"></span>';
  sw.onclick = ()=>{
    datos.compartida = !datos.compartida;
    sw.classList.toggle('on', datos.compartida); sw.setAttribute('aria-checked', String(datos.compartida));
    lista.style.display = datos.compartida ? 'none' : '';
    cambio();
  };
  wrapT.append(sw, el('span',null,'Con todos los perfiles'));
  box.appendChild(wrapT);

  if(!otros.length){
    lista.appendChild(el('div','hint','Aún no hay otros perfiles. Cada persona crea el suyo al entrar con el PIN.'));
  } else {
    lista.appendChild(el('div','hint','…o solo con estos perfiles:'));
    const chips = el('div','tagrow');
    otros.forEach(n=>{
      const b = el('button','chip'+(datos.con.includes(n)?' on':''), n); b.type='button';
      b.setAttribute('aria-pressed', String(datos.con.includes(n)));
      b.onclick = ()=>{
        const i = datos.con.indexOf(n);
        if(i>=0) datos.con.splice(i,1); else datos.con.push(n);
        b.classList.toggle('on', i<0); b.setAttribute('aria-pressed', String(i<0));
        cambio();
      };
      chips.appendChild(b);
    });
    lista.appendChild(chips);
  }
  lista.style.display = datos.compartida ? 'none' : '';
  box.appendChild(lista);
  return box;
}

  const statusEl = el('div','status' + (state.aiStatus.startsWith('No se pudo') ? ' err' : state.aiStatus.startsWith('✅') ? ' good' : ''), state.aiStatus);
  box.appendChild(statusEl);

  const tField = el('div','field'); tField.appendChild(el('label',null,'Título'));
  const tInp = el('input'); tInp.type='text'; tInp.value=f.titulo; tInp.placeholder='Nombre de la receta';
  tInp.oninput = (e)=>{ f.titulo = e.target.value; };
  tField.appendChild(tInp); box.appendChild(tField);

  const rField = el('div','field'); rField.appendChild(el('label',null,'Raciones'));
  const rInp = el('input'); rInp.type='text'; rInp.value=f.raciones; rInp.placeholder='ej. 4 personas';
  rInp.oninput = (e)=>{ f.raciones = e.target.value; };
  rField.appendChild(rInp); box.appendChild(rField);

  box.appendChild(renderEditableList('Ingredientes (con cantidad, tal cual se usan al cocinar)', f.ingredientes, 'ingrediente', s=>s));

  // etiquetas y categorías (para buscar)
  const cb = el('div','classifybox');
  const clBtn = el('button','aibtn','↺ Generar etiquetas y categorías con IA');
  clBtn.onclick = ()=> clasificar(f);
  cb.appendChild(clBtn);
  cb.appendChild(el('div','hint','Etiquetas = nombre corto de cada ingrediente («salmón»). Categorías = tipo general («pescado»). Sirven para buscar.'));
  box.appendChild(cb);

  const catField = el('div','field'); catField.appendChild(el('label',null,'Categorías'));
  const catBar = el('div','tagrow');
  CATEGORIAS.forEach(c=>{
    const b = el('button','chip cat'+(f.categorias.includes(c)?' on':''), c);
    b.type = 'button';
    b.onclick = ()=>{
      const i = f.categorias.indexOf(c);
      if(i>=0) f.categorias.splice(i,1); else f.categorias.push(c);
      b.classList.toggle('on');
    };
    catBar.appendChild(b);
  });
  catField.appendChild(catBar); box.appendChild(catField);

  box.appendChild(renderEditableList('Etiquetas de ingredientes', f.etiquetas, 'etiqueta', normTag));
  box.appendChild(renderEditableList('Pasos', f.pasos, 'paso', s=>s));

  const shareField = el('div','field'); shareField.appendChild(el('label',null,'Compartir con (por defecto, solo tú la ves)'));
  shareField.appendChild(renderCompartir({
    get compartida(){ return f.compartida; }, set compartida(v){ f.compartida = v; }, con: f.compartidaCon,
  }, ()=>{}));
  box.appendChild(shareField);

  const savebar = el('div','savebar');

  const saveBtn = el('button','savebtn','Guardar receta');
  saveBtn.onclick = async ()=>{
    if(!f.titulo.trim()){ state.aiStatus='Ponle un título a la receta.'; render(); return; }
    saveBtn.disabled = true; saveBtn.textContent='Guardando…';
    try{
      await api('/api/recipes', { method:'POST', body: JSON.stringify({
        titulo: f.titulo.trim(),
        raciones: f.raciones ? f.raciones.trim() : null,
        ingredientes: f.ingredientes.map(s=>s.trim()).filter(Boolean),
        etiquetas: f.etiquetas.map(normTag).filter(Boolean),
        categorias: f.categorias,
        pasos: f.pasos.filter(s=>s.trim()),
        origen: f.origen,
        source_url: (f.origen==='youtube' && extractYoutubeId(f.sourceUrl)) ? 'https://www.youtube.com/watch?v=' + extractYoutubeId(f.sourceUrl) : f.sourceUrl,
        video_id: f.origen==='youtube' ? extractYoutubeId(f.sourceUrl) : '',
        compartida: f.compartida,
        compartida_con: f.compartida ? [] : f.compartidaCon,
        image_base64: f.origen==='foto' ? f.imageB64 : '',
        image_mime: f.origen==='foto' ? f.imageMime : '',
      })});
      state.modal = null; state.tab = 'mias';
      await loadAll();
    }catch(e){
      state.aiStatus = 'No se pudo guardar: ' + e.message;
      render();
    }
  };
  savebar.appendChild(saveBtn);
  box.appendChild(savebar);
  return box;
}

function renderEditableList(label, arr, placeholder, normalizer){
  const field = el('div','field');
  field.appendChild(el('label',null,label));
  const listEl = el('div','listedit');
  function draw(){
    listEl.innerHTML = '';
    arr.forEach((val,i)=>{
      const row = el('div','row');
      const inp = el('input'); inp.type='text'; inp.value=val;
      inp.oninput = (e)=>{ arr[i] = e.target.value; };
      inp.onblur = ()=>{ if(normalizer) arr[i] = normalizer(arr[i]); };
      const rm = el('button','rm','×'); rm.type='button'; rm.setAttribute('aria-label','Quitar');
      rm.onclick = ()=>{ arr.splice(i,1); draw(); };
      row.append(inp, rm);
      listEl.appendChild(row);
    });
    const add = el('button','addline','+ añadir '+placeholder); add.type='button';
    add.onclick = ()=>{ arr.push(''); draw(); const ins = listEl.querySelectorAll('input'); if(ins.length) ins[ins.length-1].focus(); };
    listEl.appendChild(add);
  }
  draw();
  field.appendChild(listEl);
  return field;
}

// ---------- detalle ----------
function renderDetailModal(){
  const r = state.selected;
  const esMia = r.propietario === perfil;
  const overlay = el('div','overlay');
  overlay.onclick = (e)=>{ if(e.target===overlay){ state.modal=null; render(); } };
  const modal = el('div','modal');
  overlay.appendChild(modal);
  const close = el('button','closebtn'); close.innerHTML='&times;'; close.setAttribute('aria-label','Cerrar');
  close.onclick = ()=>{ state.modal=null; render(); };
  modal.appendChild(close);
  modal.appendChild(el('h2',null,r.titulo));
  if(!esMia && r.propietario){
    const p = el('div','hint'); p.textContent = 'Compartida por ' + r.propietario; modal.appendChild(p);
  }

  if(r.origen==='foto' && r.image_url){
    const d = el('div','detail-media');
    const img = el('img'); img.src = r.image_url; img.alt = r.titulo;
    d.appendChild(img); modal.appendChild(d);
  }
  if(r.origen==='youtube' && r.video_id){
    const d = el('div','detail-media');
    const fr = el('iframe'); fr.src = 'https://www.youtube.com/embed/'+encodeURIComponent(r.video_id); fr.allowFullscreen = true;
    d.appendChild(fr); modal.appendChild(d);
  }

  const tags = el('div','detail-tags');
  (r.categorias||[]).forEach(t=> tags.appendChild(el('span','chip cat',t)));
  (r.etiquetas||[]).forEach(t=> tags.appendChild(el('span','chip',t)));
  modal.appendChild(tags);

  const cols = el('div','detail-cols');
  const racionesHtml = r.raciones ? `<p style="margin:0 0 10px;color:var(--ink-soft);font-size:0.85rem;">${escapeHtml(r.raciones)}</p>` : '';
  cols.innerHTML = `
    <div><h4>Ingredientes</h4>${racionesHtml}<ul>${(r.ingredientes||[]).map(i=>`<li>${escapeHtml(i)}</li>`).join('')}</ul></div>
    <div><h4>Pasos</h4><ol>${(r.pasos||[]).map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ol></div>
  `;
  modal.appendChild(cols);

  // Notas personales: solo las ve y las edita este perfil
  const nb = el('div','notebox');
  nb.appendChild(el('h4',null,'Mis notas'));
  const nta = el('textarea'); nta.maxLength = 2000; nta.value = r.nota || '';
  nta.placeholder = 'Apunta lo que cambiarías, trucos, cuánto tarda de verdad… Solo lo ves tú.';
  const nst = el('div','notestate');
  const guardarNota = async ()=>{
    const texto = nta.value.trim();
    if(texto === (r.nota||'')) return;
    nst.textContent = 'Guardando…';
    try{
      const out = await api('/api/recipes/'+r.id+'/nota', { method:'PATCH', body: JSON.stringify({ texto }) });
      r.nota = out.nota; nst.textContent = 'Guardado';
      setTimeout(()=>{ nst.textContent=''; }, 1500);
    }catch(e){ nst.textContent = 'No se pudo guardar: ' + e.message; }
  };
  nta.onblur = guardarNota;
  nb.append(nta, nst);
  modal.appendChild(nb);

  if(r.source_url && /^https?:\/\//i.test(r.source_url)){
    const a = el('a','srclink','Ver fuente original ↗'); a.href=r.source_url; a.target='_blank'; a.rel='noopener';
    modal.appendChild(a);
  }

  if(esMia || !r.propietario){
    const bar = el('div','detailbar');
    if(esMia){
      const col = el('div','sharecol');

      col.appendChild(el('div','hint','Compartir esta receta con:'));
      const datos = { compartida: !!r.compartida, con: (r.compartida_con||[]).slice() };
      col.appendChild(renderCompartir(datos, async ()=>{
        try{
          await api('/api/recipes/'+r.id+'/compartir', { method:'PATCH', body: JSON.stringify({ compartida: datos.compartida, con: datos.con }) });
          r.compartida = datos.compartida; r.compartida_con = datos.con.slice();
          fillResults();
        }catch(e){ alert('No se pudo cambiar: ' + e.message); }
      }));

      // Enlace público: cualquiera con el enlace puede ver esta receta, sin PIN ni perfil
      const wrapP = el('label','sharetoggle');
      const swP = el('button','switch'+(r.token_publico?' on':'')); swP.type='button';
      swP.setAttribute('role','switch'); swP.setAttribute('aria-checked', String(!!r.token_publico));
      swP.innerHTML = '<span class="dot"></span>';
      swP.onclick = async ()=>{
        try{
          const nueva = await api('/api/recipes/'+r.id+'/publico', { method:'PATCH', body: JSON.stringify({ publica: !r.token_publico }) });
          r.token_publico = nueva.token_publico;
          render();
        }catch(e){ alert('No se pudo cambiar: ' + e.message); }
      };
      wrapP.append(swP, el('span',null,'Enlace público para cualquier persona'));
      col.appendChild(wrapP);

      if(r.token_publico){
        const url = location.origin + '/r/' + r.token_publico;
        const row = el('div','linkrow');
        const inp = el('input'); inp.type='text'; inp.readOnly = true; inp.value = url;
        inp.onfocus = ()=> inp.select();
        const cop = el('button','aibtn','Copiar');
        cop.onclick = async ()=>{
          try{ await navigator.clipboard.writeText(url); }catch(e){ inp.select(); try{ document.execCommand('copy'); }catch(e2){} }
          cop.textContent = 'Copiado'; setTimeout(()=>{ cop.textContent = 'Copiar'; }, 1500);
        };
        row.append(inp, cop);
        col.appendChild(row);
        col.appendChild(el('div','hint','Quien tenga este enlace puede ver la receta (sin PIN ni perfil), pero no el resto de tus recetas. Apaga el interruptor para que el enlace deje de funcionar.'));
      }
      bar.appendChild(col);
    } else {
      bar.appendChild(el('span'));
    }
    const del = el('button','delbtn','Eliminar receta');
    del.onclick = async ()=>{
      if(!confirm('¿Eliminar esta receta?')) return;
      state.modal = null; render();
      try{ await api('/api/recipes/'+r.id, { method:'DELETE' }); }catch(e){ alert('No se pudo eliminar: ' + e.message); }
      await loadAll();
    };
    bar.appendChild(del);
    modal.appendChild(bar);
  }
  return overlay;
}

boot();
</script>
